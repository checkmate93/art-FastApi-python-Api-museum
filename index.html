<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Art Curator AI</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: #fff; }
    .card { background: #2a2a2a; border-radius: 8px; padding: 15px; max-width: 500px; margin: auto; text-align: center; }
    img { max-width: 100%; height: auto; border-radius: 4px; margin-top: 10px; }
    button { background: #f5b301; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 15px; }
    button:hover { background: #d49b00; }
  </style>
</head>
<body>

<div class="card">
  <h2 id="artwork-title">Φόρτωση έργου...</h2>
  <p id="artwork-artist">Καλλιτέχνης</p>
  <img id="artwork-image" src="" alt="Artwork" />
  <p id="curator-comment" style="margin-top: 15px; font-style: italic;"></p>
  <button id="next-btn" onclick="fetchNextArtwork()">ΕΠΟΜΕΝΟ</button>
</div>

<script>
  // Το Render URL του backend σου
  const BACKEND_URL = "https://art-b2pg.onrender.com";

  async function fetchNextArtwork() {
    const titleEl = document.getElementById('artwork-title');
    const artistEl = document.getElementById('artwork-artist');
    const imgEl = document.getElementById('artwork-image');
    const commentEl = document.getElementById('curator-comment');
    const nextBtn = document.getElementById('next-btn');

    nextBtn.disabled = true;
    titleEl.innerText = "Αναζήτηση έργου...";
    commentEl.innerText = "";

    try {
      // 1. Καλούμε το επίσημο API του Chicago Museum
      // Ζητάμε ρητά τα πεδία id, title, artist_title, image_id
      const randomPage = Math.floor(Math.random() * 50) + 1;
      const museumRes = await fetch(`https://api.artic.edu/api/v1/artworks/search?query[term][is_public_domain]=true&limit=1&page=${randomPage}&fields=id,title,artist_title,image_id`);
      
      if (!museumRes.ok) throw new Error(`Museum API HTTP error! status: ${museumRes.status}`);
      const museumData = await museumRes.json();

      if (!museumData.data || museumData.data.length === 0) {
        throw new Error("Δεν βρέθηκαν έργα");
      }

      const artwork = museumData.data[0];
      const iiifBaseUrl = museumData.config?.iiif_url || "https://www.artic.edu/iiif/2";

      titleEl.innerText = artwork.title || "Χωρίς Τίτλο";
      artistEl.innerText = artwork.artist_title || "Άγνωστος Καλλιτέχνης";

      // 2. Ασφαλής κατασκευή του IIIF Image URL (αποφυγή 403 Forbidden)
      if (artwork.image_id) {
        imgEl.src = `${iiifBaseUrl}/${artwork.image_id}/full/843,/0/default.jpg`;
      } else {
        imgEl.src = "https://placehold.co/600x400/333333/ffffff?text=No+Image+Available";
      }

      // Fallback σε περίπτωση που αποτύχει η εικόνα κατά τη φόρτωση
      imgEl.onerror = () => {
        imgEl.src = "https://placehold.co/600x400/333333/ffffff?text=Image+Unavailable";
      };

      // 3. Κλήση στο Render backend για σχολιασμό από το Groq AI
      commentEl.innerText = "Ο AI Curator αναλύει το έργο...";
      const aiRes = await fetch(`${BACKEND_URL}/api/curate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: artwork.title,
          artist: artwork.artist_title
        })
      });

      if (aiRes.ok) {
        const aiData = await aiRes.json();
        commentEl.innerText = aiData.comment;
      } else {
        commentEl.innerText = "Δεν ήταν δυνατή η φόρτωση σχολίου.";
      }

    } catch (err) {
      console.error("Error:", err);
      titleEl.innerText = "Αδυναμία φόρτωσης";
      artistEl.innerText = "Μουσείο Chicago - Δοκιμάστε ξανά";
    } finally {
      nextBtn.disabled = false;
    }
  }

  // Αρχική φόρτωση
  fetchNextArtwork();
</script>
</body>
</html>
