<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Curator AI</title>

<style>
:root { 
    --bg: #0f172a; 
    --panel-bg: #1e293b; 
    --accent: #fbbf24; 
    --text: #f8fafc; 
    --text-muted: #cbd5e1;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body { 
    font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
    background: var(--bg); 
    color: var(--text); 
    width: 100vw; 
    height: 100vh; 
    height: 100dvh; 
    overflow: hidden; 
}

#tv-safe-area { padding: 3vh 3vw; width: 100%; height: 100%; }
#main-grid { display: flex; flex-direction: row; gap: 2vw; height: 100%; width: 100%; }

.left-panel { 
    flex: 6.5; 
    display: flex; 
    flex-direction: column; 
    background: var(--panel-bg); 
    border-radius: 15px; 
    padding: 10px; 
    box-shadow: var(--shadow); 
    height: 100%; 
}

.image-container { 
    flex-grow: 1; 
    min-height: 0; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
}

#art-image { 
    max-width: 100%; 
    max-height: 100%; 
    object-fit: contain; 
    border-radius: 8px; 
    display: none; 
}

#enter-canvas-btn { 
    flex-shrink: 0; 
    margin-top: 10px; 
    background: rgba(15, 23, 42, 0.8); 
    color: white; 
    border: 1px solid var(--accent); 
    padding: 10px 20px; 
    border-radius: 20px; 
    font-size: 18px; 
    cursor: pointer; 
    align-self: center; 
}

#enter-canvas-btn:hover { background: var(--accent); color: var(--bg); }

.right-panel { 
    flex: 3.5; 
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
    height: 100%; 
}

select { 
    width: 100%; 
    padding: 10px 15px; 
    border-radius: 8px; 
    background: #0f172a; 
    color: white; 
    border: 1px solid #334155; 
    font-size: 18px; 
    cursor: pointer; 
}

.info-box { 
    flex-grow: 1; 
    min-height: 0; 
    background: var(--panel-bg); 
    border-radius: 15px; 
    padding: 20px; 
    overflow-y: auto; 
    box-shadow: var(--shadow); 
    display: flex; 
    flex-direction: column; 
}

#art-title { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
.artist-name { font-size: 18px; color: var(--accent); margin-bottom: 15px; }
#ai-fact { font-size: 20px; line-height: 1.6; color: var(--text-muted); }
#ai-fact strong { color: white; }

.btn-group { display: flex; flex-direction: row; gap: 10px; }

button.control-btn { 
    flex: 1; 
    border: none; 
    padding: 12px 2px; 
    border-radius: 10px; 
    font-size: 16px; 
    font-weight: bold; 
    cursor: pointer; 
}

#next-btn { background: var(--accent); color: #0f172a; }
#next-btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
#auto-btn { background: #334155; color: white; border: 1px solid #475569; }
#auto-btn.active { background: #ef4444; border-color: #ef4444; }
#show-all-btn { background: #334155; color: white; border: 1px solid #475569; }
#show-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }

#fullscreen-overlay { 
    display: none; 
    position: fixed; 
    top: 0; left: 0; width: 100vw; height: 100vh; 
    background: black; 
    z-index: 9999; 
    align-items: center; justify-content: center; 
}
#fullscreen-image { width: 100%; height: 100%; object-fit: contain; }
#fixed-back-btn { 
    position: absolute; top: 30px; left: 30px; 
    background: rgba(239, 68, 68, 0.9); color: white; 
    padding: 12px 24px; font-size: 18px; font-weight: bold; 
    border: none; border-radius: 10px; cursor: pointer; 
}
</style>
</head>

<body>

<div id="fullscreen-overlay">
    <button id="fixed-back-btn" onclick="exitCanvas()">⬅ ΕΠΙΣΤΡΟΦΗ</button>
    <img id="fullscreen-image" alt="Artwork fullscreen">
</div>

<div id="tv-safe-area">
    <div id="main-grid">
        <div class="left-panel">
            <div class="image-container">
                <img id="art-image" alt="Artwork display">
            </div>
            <button id="enter-canvas-btn" onclick="enterCanvas()">🔍 Προβολή σε Καμβά</button>
        </div>

        <div class="right-panel">
            <select id="category-select" onchange="loadCuratedArt()">
                <option value="Impressionism">🎨 Ιμπρεσιονισμός</option>
                <option value="Renaissance">🏰 Αναγέννηση</option>
                <option value="Greek">🏺 Αρχαία Ελληνική Τέχνη</option>
                <option value="Japanese">🌊 Ιαπωνική Τέχνη</option>
                <option value="Surrealism">👁️ Σουρεαλισμός</option>
            </select>

            <div class="info-box" id="scrollable-info">
                <h1 id="art-title">Curiosity Gallery</h1>
                <div id="artist-name" class="artist-name">Επιλέξτε...</div>
                <div id="ai-fact">Το AI Curator είναι έτοιμο.</div>
            </div>

            <div class="btn-group">
                <button id="next-btn" class="control-btn" onclick="loadCuratedArt()">ΕΠΟΜΕΝΟ</button>
                <button id="show-all-btn" class="control-btn" onclick="showAllText()" disabled>📖 ΟΛΟ</button>
                <button id="auto-btn" class="control-btn" onclick="toggleAutoMode()">⏱️ AUTO (3λ)</button>
            </div>
        </div>
    </div>
</div>

<script>
const BACKEND_URL = "https://art-b2pg.onrender.com";

function enterCanvas() {
    const mainImg = document.getElementById('art-image');
    if (!mainImg.src) return;
    document.getElementById('fullscreen-image').src = mainImg.src;
    document.getElementById('fullscreen-overlay').style.display = 'flex';
}
function exitCanvas() { document.getElementById('fullscreen-overlay').style.display = 'none'; }

let autoInterval, isAutoMode = false;
function toggleAutoMode() {
    const btn = document.getElementById('auto-btn');
    isAutoMode = !isAutoMode;
    if (isAutoMode) {
        btn.classList.add('active'); btn.innerText = "🛑 ΔΙΑΚΟΠΗ";
        loadCuratedArt();
        if (autoInterval) clearInterval(autoInterval);
        autoInterval = setInterval(loadCuratedArt, 180000);
    } else {
        btn.classList.remove('active'); btn.innerText = "⏱️ AUTO (3λ)";
        if (autoInterval) clearInterval(autoInterval);
    }
}

let currentFullText = "";
function showAllText() {
    if (!currentFullText) return;
    typingSession++;
    document.getElementById('ai-fact').innerHTML = currentFullText;
    document.getElementById('scrollable-info').scrollTop = 0;
    document.getElementById('show-all-btn').disabled = true;
}

let typingSession = 0;
function typeWriterHTML(element, htmlString) {
    typingSession++;
    const currentSession = typingSession;
    element.innerHTML = "";
    const container = document.getElementById('scrollable-info');
    let i = 0;

    function type() {
        if (currentSession !== typingSession) return;
        if (i < htmlString.length) {
            let char = htmlString.charAt(i);
            let delay = 10;
            if (char === '<') {
                let tagEnd = htmlString.indexOf('>', i);
                if (tagEnd !== -1) {
                    element.innerHTML += htmlString.substring(i, tagEnd + 1);
                    i = tagEnd + 1;
                    delay = 0;
                } else { element.innerHTML += char; i++; }
            } else {
                element.innerHTML += char;
                i++;
                if (char === '.' || char === '!' || char === '?') delay += 2500;
                else if (char === ':') delay += 1200;
                else if (char === ',') delay += 200;
            }
            container.scrollTop = container.scrollHeight;
            setTimeout(type, delay);
        } else {
            document.getElementById('show-all-btn').disabled = true;
        }
    }
    type();
}

async function loadCuratedArt() {
    const nextBtn = document.getElementById('next-btn');
    const showAllBtn = document.getElementById('show-all-btn');
    const catSelect = document.getElementById('category-select');
    const img = document.getElementById('art-image');
    const titleEl = document.getElementById('art-title');
    const artistEl = document.getElementById('artist-name');
    const factEl = document.getElementById('ai-fact');

    typingSession++;
    currentFullText = "";
    showAllBtn.disabled = true;
    nextBtn.disabled = true;
    catSelect.disabled = true;
    nextBtn.innerText = "...";
    titleEl.innerText = "Αναζήτηση πίνακα...";
    factEl.innerHTML = "<em>Ο AI Curator ερευνά το έργο...</em>";
    exitCanvas();

    try {
        const response = await fetch(`${BACKEND_URL}/api/art-curate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ category: catSelect.value })
        });

        if (!response.ok) throw new Error(`Backend response status: ${response.status}`);
        const data = await response.json();

        titleEl.innerText = data.title;
        artistEl.innerText = data.artist;

        img.onload = () => { img.style.display = "block"; };
        img.src = data.imageUrl;

        let formattedText = data.comment.replace("🎯 Fun Fact:", "<strong>🎯 Fun Fact:</strong><br>")
                                        .replace("🎨 Ανάλυση:", "<br><br><strong>🎨 Ανάλυση:</strong><br>")
                                        .replace("🧠 Context:", "<br><br><strong>🧠 Context:</strong><br>");

        currentFullText = formattedText;
        showAllBtn.disabled = false;
        typeWriterHTML(factEl, formattedText);

    } catch (err) {
        console.error("Fetch Error:", err);
        titleEl.innerText = "Αδυναμία φόρτωσης.";
        artistEl.innerText = "Δοκιμάστε ξανά";
        factEl.innerText = "Πατήστε 'ΕΠΟΜΕΝΟ' για επανάληψη.";
    } finally {
        nextBtn.disabled = false;
        catSelect.disabled = false;
        nextBtn.innerText = "ΕΠΟΜΕΝΟ";
    }
}

window.onload = loadCuratedArt;
</script>

</body>
</html>
